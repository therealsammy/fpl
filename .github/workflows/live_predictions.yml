name: Live prediction archive

# Friday 15:00 UTC -- one hour after odds.yml (14:00 UTC), so this week's
# betting line is archived alongside the model at its freshest, and after
# understat.yml (Thu 06:00) so the GLM's form covariates reflect the
# week's results too. This run IS the GLM's recalibration in production:
# models/live_predictions.py refits every model fresh from whatever's on
# disk, with no cached/pickled state to go stale.
on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: live-prediction-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -m, not a bare file path: this imports core.archive, core.ids,
      # and validation.scoreboard, all siblings, which only resolve with
      # the repo root on sys.path.
      - name: Archive this week's live predictions
        run: python -m models.live_predictions

      - name: Commit the new forecasts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          git add data/forecasts/

          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit."
          else
            git commit -m "Live prediction archive $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi
