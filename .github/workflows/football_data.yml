name: Football-Data collector

# Wednesday 06:00 UTC -- offset from the Tuesday FPL run and Friday odds
# run so the three don't compete for CI minutes. Weekly is plenty: this
# data barely changes mid-week, and completed seasons are fetched once
# ever (see collectors/football_data.py) -- only the current season's
# file and any newly-added leagues/seasons do real work most weeks.
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: football-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A first-ever run fetches ~200 season files (6 leagues x ~34
    # seasons) at 1 request/second -- budget generously. Subsequent runs
    # are much faster since historical seasons are cached and skipped.
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -m, not a bare file path: this imports core.ids and
      # collectors.fpl_odds, both siblings, which only resolve with the
      # repo root on sys.path.
      - name: Run the Football-Data collector
        run: python -m collectors.football_data

      - name: Commit the new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          git add data/odds/football_data/
          if [ -d data/ids ]; then
            git add data/ids/
          fi

          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit."
          else
            git commit -m "Football-Data snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi
