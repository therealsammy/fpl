name: Understat xG collector

# Thursday 06:00 UTC -- a day after football_data.yml (Wed 06:00) and a day
# before odds.yml (Fri 14:00), so the GLM's covariates (npxG/PPDA/deep
# completions/xPts form) are refreshed with the week's results before the
# Friday live-prediction snapshot uses them. This is also what keeps the
# GLM's coefficients genuinely recalibrating week to week rather than being
# fit once and left stale -- see models/match.py's fit_team_strengths_glm.
on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: understat-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -m, not a bare file path: this imports core.ids, a sibling
      # package, which only resolves with the repo root on sys.path.
      - name: Run the Understat collector
        run: python -m collectors.understat

      - name: Commit the new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          git add data/xg/
          if [ -d data/ids ]; then
            git add data/ids/
          fi

          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit."
          else
            git commit -m "Understat xG snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi
