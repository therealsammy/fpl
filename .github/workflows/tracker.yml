name: FPL weekly snapshot

# Tuesday 08:00 UTC. By then bonus points are confirmed and prices have settled.
# GitHub runs scheduled jobs on a best-effort basis and can delay them by
# 10-40 minutes at busy times. That's fine here -- nothing is time-critical.
on:
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: fpl-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tracker
        env:
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
        run: python fpl_tracker.py

      - name: Commit the new snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          git add fpl_history.csv fpl_tracker.xlsx
          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit."
          else
            git commit -m "FPL snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi

      # Belt and braces: if the push ever fails, the data still survives
      # as a downloadable artifact you can recover by hand.
      - name: Keep a backup copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-snapshot-${{ github.run_number }}
          path: |
            fpl_history.csv
            fpl_tracker.xlsx
          retention-days: 90
          if-no-files-found: warn