name: FPL weekly snapshot

# Tuesday 08:00 UTC. By then bonus points are confirmed and prices have settled.
# GitHub runs scheduled jobs on a best-effort basis and can delay them by
# 10-40 minutes at busy times. That's fine here -- nothing is time-critical.
on:
  schedule:
    - cron: '0 8 * * 2'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: fpl-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tracker
        env:
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
        run: python fpl_tracker.py

      # From here down: analytics built on top of the tracker's snapshot.
      # Each gets continue-on-error -- a bug or a flaky call in any one of
      # them must never block fpl_history.csv (irreplaceable) from being
      # committed below.
      - name: Run the minutes model
        continue-on-error: true
        run: python fpl_minutes.py

      - name: Run the mini-league rival tracker
        continue-on-error: true
        env:
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
        run: python fpl_rivals.py

      - name: Run the signals digest
        continue-on-error: true
        run: python fpl_signals.py

      - name: Run the DEFCON hypothesis test
        continue-on-error: true
        run: python fpl_defcon.py

      # Once the tracker confirms a gameweek finished, that's the moment
      # its actual results become knowable -- so validation belongs on
      # this schedule, not the pre-deadline Friday one.
      - name: Validate projections against actual results
        continue-on-error: true
        run: python validate_projections.py

      - name: Commit the new snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          # Some of these only exist if their step actually ran and wrote
          # output (continue-on-error above means a failed step just skips
          # its file here rather than failing this add).
          for f in fpl_history.csv fpl_tracker.xlsx \
                   fpl_minutes.csv fpl_rivals.csv signals.csv \
                   defcon_report.csv defcon_dataset.csv validate_report.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit."
          else
            git commit -m "FPL snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi

      # Belt and braces: if the push ever fails, the data still survives
      # as a downloadable artifact you can recover by hand.
      - name: Keep a backup copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-snapshot-${{ github.run_number }}
          path: |
            fpl_history.csv
            fpl_tracker.xlsx
            fpl_minutes.csv
            fpl_rivals.csv
            signals.csv
            defcon_report.csv
            defcon_dataset.csv
            validate_report.csv
          retention-days: 90
          if-no-files-found: warn