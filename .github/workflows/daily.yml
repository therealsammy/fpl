name: FPL daily snapshot

# 06:00 UTC daily -- light and fast, unlike the Tuesday heavy run. Prices
# and ownership move every day; a weekly-only cadence permanently loses
# the resolution a price-change model needs. Per SPEC.md, this is the
# single highest-value item in the whole platform plan.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: fpl-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -m, not a bare file path: this script imports core.archive (a
      # sibling package), which only resolves if the repo root is on
      # sys.path -- module invocation guarantees that, a plain
      # `python collectors/fpl_daily_snapshot.py` does not.
      - name: Run the daily snapshot
        run: python -m collectors.fpl_daily_snapshot

      - name: Commit the new snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          git add data/fpl/snapshots/ data/forecasts/
          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit (or the fetch was skipped)."
          else
            git commit -m "FPL daily snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi
