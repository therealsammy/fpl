name: FPL odds and projections

# Friday 14:00 UTC -- after most pressers, before Saturday deadlines. Odds
# go stale fast, so this does NOT belong on the Tuesday tracker schedule.
# Note: UK clocks change in late October, so the UTC/UK-local gap shifts by
# an hour mid-season. 14:00 UTC stays safely ahead of an 11:00 UK Saturday
# deadline either way.
on:
  schedule:
    - cron: '0 14 * * 5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# The job pushes a commit back, so it needs write access to the repo.
permissions:
  contents: write

# If a manual run overlaps the scheduled one, let the first finish.
concurrency:
  group: fpl-odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ordering matters: minutes, then odds, then projections. Each gets
      # continue-on-error -- a stale minutes model or a flaky odds call
      # must never block whatever the later steps CAN still produce, and
      # must never block the commit step from saving what did succeed.
      - name: Refresh the minutes model
        continue-on-error: true
        run: python models/minutes.py

      - name: Run the odds collector
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python collectors/fpl_odds.py

      - name: Run player projections
        continue-on-error: true
        run: python models/projections.py

      - name: Commit the new odds and projections snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Someone may have pushed since checkout; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          # fixture_projections.csv and projections.csv are append-only too
          # (not disposable) -- phase 6's validator needs past projections
          # to survive so it can compare them against actual results once
          # the gameweek finishes.
          for f in fpl_minutes.csv fpl_odds.csv fixture_projections.csv projections.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if [ -d odds_raw ]; then
            git add odds_raw/
          fi

          if git diff --staged --quiet; then
            echo "No change in the data -- nothing to commit."
          else
            git commit -m "FPL odds and projections snapshot $(date -u +%Y-%m-%d)"
            git push
            echo "Snapshot committed."
          fi

      # Belt and braces: if the push ever fails, the data still survives
      # as a downloadable artifact you can recover by hand.
      - name: Keep a backup copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-odds-${{ github.run_number }}
          path: |
            fpl_minutes.csv
            fpl_odds.csv
            fixture_projections.csv
            projections.csv
            odds_raw/
          retention-days: 90
          if-no-files-found: warn
